<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>宗心会 出欠・隔離LINE試験</title><link rel="stylesheet" href="portal.css"><script defer src="https://static.line-scdn.net/liff/edge/2/sdk.js" integrity="sha384-1oGcmuvrrA8FN0gjWHb5JnzfrBAcRfLRUY3yykZMm79iIMHAWTxEgEmWJrN6CxLN" crossorigin="anonymous"></script><script defer src="config.js"></script><script defer src="portal.js"></script></head><body><main>
<aside class="banner"><b>隔離LINE通し試験</b><br>本物のLINEで認証し、合成会員の回答を専用台帳に保存します。本番には保存しません。</aside>
<section id="loading" class="card"><h1>LINEで認証しています</h1><p>しばらくお待ちください。</p></section>
<section id="register" class="card" hidden><h1>合成会員の本人確認</h1><p>試験用に指定した合成情報を入力してください。実際の氏名・生年月日は入力しないでください。</p><form id="lookupForm"><label for="name">合成の氏名</label><input id="name" maxlength="100" autocomplete="off" required><label for="term">部内期数</label><input id="term" inputmode="numeric" maxlength="6" autocomplete="off" required><label for="birth">合成の生年月日</label><input id="birth" type="date" autocomplete="off" required><button type="submit">照合する</button></form></section>
<section id="confirm" class="card" hidden><h1>この合成会員で連携しますか？</h1><p id="confirmName"></p><p id="confirmTerm"></p><button id="confirmSave" type="button">確認してイベントへ戻る</button><button id="confirmBack" class="secondary" type="button">入力へ戻る</button></section>
<section id="event" class="card" hidden><h1 id="subject"></h1><p id="schedule"></p><p id="deadline"></p><p id="member"></p><p id="current" aria-live="polite"></p><p id="guide"></p><form id="answerForm"><fieldset><legend>参加予定を教えてください</legend><div class="choices"><label><input type="radio" name="attendance" value="出席">参加</label><label><input type="radio" name="attendance" value="未定">未定</label><label><input type="radio" name="attendance" value="欠席">欠席</label></div></fieldset><button id="save" type="submit">この回答を保存</button></form><p id="answerNote"></p><p id="walkinNote">なお、回答締切り後も、当日、自由に飛び入り参加できます。<br>入室、退出の時間も自由ですので、いつでも遊びに来てください。</p><p id="notice" role="status"></p></section>
<p id="error" class="error" role="alert"></p><button id="reload" type="button" class="secondary">再読み込み・認証を確認</button>
</main></body></html>
